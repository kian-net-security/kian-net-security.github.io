<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kian Net Security</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #4c1d95, #7c3aed, #a855f7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d28d9, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 10px 25px rgba(109,40,217,0.35);
        }

        h1 {
            margin: 0 0 20px;
            color: #4c1d95;
            font-size: 22px;
            line-height: 1.8;
        }

        .description {
            color: #555;
            font-size: 16px;
            line-height: 2;
            margin-bottom: 30px;
        }

        .telegram {
            display: block;
            text-decoration: none;
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            color: white;
            padding: 17px 20px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(109,40,217,0.3);
            transition: transform 0.2s;
        }

        .telegram:hover {
            transform: translateY(-2px);
        }

        .username {
            margin-top: 13px;
            color: #6d28d9;
            font-size: 14px;
            direction: ltr;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            🛡️
        </div>

        <h1>
            همراه شما در تأمین امنیت شبکه‌های اجتماعی
            و ارائه خدمات VPN
        </h1>

        <div class="description">
            برای ارتباط و دریافت اطلاعات بیشتر،
            از طریق تلگرام با ما در ارتباط باشید.
        </div>

        <a class="telegram"
           href="https://t.me/Kian_net_security"
           target="_blank">
            📲 ارتباط در تلگرام
        </a>

        <div class="username">
            @Kian_net_security
        </div>

        <div class="footer">
            Kian Net Security
        </div>

    </div>

</body>
</html>
